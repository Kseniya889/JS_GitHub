<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resonator</title>

  <link rel="stylesheet" href="./reset.css">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
<header class="header">
  <a class="header__logo">
    <img src="./images/logo.png" 
    alt="Resonator" 
    class="header__logo-img" 
    width="132"
    height="20"
    loading="lazy">
  </a>

  <nav class="header__menu">
    <ul class="header__menu-list">
      <li class="header__menu-item">
        <a href="" class="header__menu-link is-current">Homes</a>
      </li>
      
      <li class="header__menu-item">
        <a href="" class="header__menu-link">Pages</a>
      </li>

      <li class="header__menu-item">
        <a href="" class="header__menu-link">Podcast</a>
      </li>

      <li class="header__menu-item">
        <a href="" class="header__menu-link">Blog</a>
      </li>

      <li class="header__menu-item">
        <a href="" class="header__menu-link">Shop</a>
      </li>
    </ul>
  </nav>

<div class="header-actions">
  <!-- кнопка пошук -->
  <div class="search">
    <button class="search__btn btn">
      <span>Search</span>
    </button>
  </div>
<!-- 
  <form class="search__form">
  <input type="search__input" placeholder="Search..." />
  <button class="search__submit" type="submit">...</button>
</form> -->


  <button class="burger-button btn" type="button">
    <svg width="25" height="25" viewBox="0 0 25 25" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect width="5" height="5" rx="2.5" fill="black"/>
      <rect x="10" width="5" height="5" rx="2.5" fill="black"/>
      <rect x="20" width="5" height="5" rx="2.5" fill="black"/>
      <rect y="10" width="5" height="5" rx="2.5" fill="black"/>
      <rect x="10" y="10" width="5" height="5" rx="2.5" fill="black"/>
      <rect x="20" y="10" width="5" height="5" rx="2.5" fill="black"/>
      <rect y="20" width="5" height="5" rx="2.5" fill="black"/>
      <rect x="10" y="20" width="5" height="5" rx="2.5" fill="black"/>
      <rect x="20" y="20" width="5" height="5" rx="2.5" fill="black"/>
      </svg>
  </button>
</div>
</header>


<main class="main">
  <section class="hero">
    <div class="hero__container">
      <div class="hero__image">
        <img src="./images/hero_bg.jpg" alt="Resonator" class="hero_bg">
      </div>

      <div class="hero__text">
        <h1 class="hero__title">New episode <br> available now</h1>
        <p class="hero__label">Available on Apple Soundcast and Spotify.</p>
        <div class="hero_btns">
          <button type="button" class="hero__btn hero__btn-apple">
            <img src="./images/header_btn1.png" alt="btn-apple">
          </button>
          <button type="button" class="hero__btn hero__btn-soundCloud">
            <img src="./images/header_btn2.png" alt="btn-soundCloud">
          </button>
        </div>

        <!-- <div class="hero__player">
          <img src="" alt="" class="hero__player-img">
          <div class="player__details">
            <h2 class="player__title"></h2>
            <p class="player__meta"></p>

            .block_player

          </div> -->
        </div>
      </div>


    </div>
  </section>
</main>

</body>
</html>
