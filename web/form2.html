<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <form action="#" method="get">
    <div>
      <p>Ім'я</p>
      <input tabindex="1" placeholder="Ім'я" type="text" name="username" id="1">
    </div>
    <div>
      <p>Пароль</p>
      <input tabindex="2" placeholder="Пароль"  type="password" name="password" id="2">
    </div>
    <div>
      <p>Телефон</p>
      <input tabindex="3" placeholder="Телефон" type="tel" name="tel" id="3">
    </div>

    <div>
      <p>Пол</p>
      <div>
        <div>
          <input tabindex="4" type="radio" checked name="gender" id="male">
          <label for="male">Чоловічий</label>
        </div>
        <div>
          <input tabindex="4" type="radio" name="gender" id="female">
          <label for="female">Жіночий</label>
        </div>
      </div>
    </div>

    <div>
      <p>Майно</p>
      <div>
        <div>
          <input tabindex="5" type="checkbox" checked name="property" id="cycle">
          <label for="cycle">Велосипед</label>
        </div>
        <div>
          <input tabindex="6" type="checkbox" name="property" id="car">
          <label for="car">Авто</label>
        </div>
        <div>
          <input tabindex="7" type="checkbox" disabled name="property" id="flat">
          <label for="flat">Квартира</label>
        </div>

        <div>
          <p>Додаткова інформація</p>
      <br>
          <textarea tabindex="8" name="additional"></textarea>
        </div>


        <div>
          <p>Прикріпіть фото</p>
          <br>
          <input tabindex="9" type="file" name="photo" id="photo">
        </div>

        <div>
          <p>Улюблений колір</p>
          <br>
          <select tabindex="10" name="color">
            <option value="red">Червоний</option>
            <option value="blue">Блакитний </option>
            <option value="green " selected>Зелений</option>
          </select>
        </div>
        <div>
          <p>Дії</p>
          <button tabindex="11" type="submit">Відправити</button>
          <button tabindex="12" type="reset">Очистити</button>
        </div>  

      </div>
    </div>

  </form>
</body>
</html>
